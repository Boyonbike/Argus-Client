plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'dev.argus'
base { archivesName = 'argus-client' }

loom {
    runs {
        client {
            // argusclient.mixins.json uses "defaultRequire": 0, so an injection that matches nothing is silently
            // skipped. Count injections in dev runs so such misses are logged (tools/audit_mixins.py checks statically).
            property 'mixin.debug.countInjections', 'true'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.lenni0451.net/releases' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.meteordev.org/snapshots'
        content { includeGroup 'meteordevelopment' }
    }
}

configurations {
    baritoneDistribution { transitive = false }
    viaDistribution { transitive = false }
}

def baritone = providers.provider {
    def jar = configurations.baritoneDistribution.singleFile
    def hash = java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
    if (hash != '8a2e7b71229005fd451e5f012f8b9c715e41531631a4a0a53c900a47cd852423') {
        throw new GradleException('Baritone artifact does not match the pinned build')
    }
    jar
}

dependencies {
    implementation('io.netty:netty-handler-proxy:4.2.15.Final') { transitive = false }
    implementation('io.netty:netty-codec-socks:4.2.15.Final') { transitive = false }
    include('io.netty:netty-handler-proxy:4.2.15.Final') { transitive = false }
    include('io.netty:netty-codec-socks:4.2.15.Final') { transitive = false }
    implementation('net.raphimc:MinecraftAuth:5.0.2') { exclude group: 'com.google.code.gson' }
    include('net.raphimc:MinecraftAuth:5.0.2') { transitive = false }
    include('net.lenni0451.commons:httpclient:1.9.2') { transitive = false }
    include('net.lenni0451.commons:gson:1.9.2') { transitive = false }
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly 'org.jetbrains:annotations:26.0.2'
    // Optional runtime integrations need their APIs on the source compile classpath.
    compileOnly('maven.modrinth:viafabricplus:wvLPUTIv') { transitive = false }
    compileOnly('maven.modrinth:lithium:f7vZ0VWU') { transitive = false }
    compileOnly('maven.modrinth:immediatelyfast:pMWERcSu') { transitive = false }
    compileOnly('maven.modrinth:sodium:xJZxADzI') { transitive = false }
    compileOnly('maven.modrinth:xaeros-minimap:kYWdcLLn') { transitive = false }
    compileOnly('maven.modrinth:entityculling:uXe0pIaz') { transitive = false }
    baritoneDistribution 'meteordevelopment:baritone:26.2-20260813.152229-1'
    viaDistribution 'maven.modrinth:viafabricplus:wvLPUTIv'
    compileOnly files(baritone)
    compileOnly files(baritone.map { jar ->
        zipTree(jar).matching { include 'META-INF/jars/nether-pathfinder-*.jar' }.files
    })
    compileOnly files(providers.provider {
        zipTree(configurations.viaDistribution.singleFile).matching {
            include 'META-INF/jars/viaversion-common-*.jar', 'META-INF/jars/Reflect-*.jar'
        }.files
    })
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.ow2.asm:asm-tree:9.10.1'
    testImplementation 'org.ow2.asm:asm-analysis:9.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '10000']
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

loom { accessWidenerPath = file('src/main/resources/argusclient.accesswidener') }
tasks.named('jar') { archiveFileName = 'argus-client.jar' }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

def releaseJar = tasks.named('jar')
tasks.test {
    dependsOn releaseJar
    useJUnitPlatform()
    classpath += sourceSets.main.compileClasspath
    inputs.file(releaseJar.flatMap { it.archiveFile })
    systemProperty 'argus.release.jar', releaseJar.flatMap { it.archiveFile }.get().asFile
}

tasks.register('verifyReleaseConfig') {
    dependsOn releaseJar
    doLast {
        def zip = new java.util.zip.ZipFile(releaseJar.get().archiveFile.get().asFile)
        try {
            java.util.Collections.list(zip.entries()).each { entry ->
                def name = entry.name
                assert !['config/', 'configs/', 'argusclient/'].any { name.startsWith(it) } : "Saved client data in release: ${name}"
                assert !name.endsWith('/gui.properties') : "Saved GUI preferences in release: ${name}"
            }
            def mixins = zip.getInputStream(zip.getEntry('argusclient.mixins.json')).text
            assert mixins.contains('"LoadingOverlayMixin"') : 'Argus loading logo mixin is missing'
            def metadata = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
            assert metadata.jars : 'No nested libraries declared'
            metadata.jars.each { assert zip.getEntry(it.file) != null : "Declared nested library missing: ${it.file}" }
            def guiMixins = zip.getInputStream(zip.getEntry('argusclient.gui.mixins.json')).text
            ['AccountSessionAccessor', 'ConnectionProxyMixin'].each { assert guiMixins.contains('"' + it + '"') : "Mixin not registered: ${it}" }
        } finally {
            zip.close()
        }
    }
}
tasks.check { dependsOn tasks.verifyReleaseConfig }
