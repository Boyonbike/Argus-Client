plugins {
    id 'fabric-loom' version '1.18.4'
}

version = project.mod_version
group = 'dev.randomstuff'
base { archivesName = 'random-stuff-client-gui' }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly files('libs/client-base.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.ow2.asm:asm-tree:9.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

// Compile/remap the GUI, then combine it with the existing client at runtime names.
// Only the GUI classes and newly compiled SearchPanel replace packaged content.
def mergedMetadata = layout.buildDirectory.file('generated/merged/fabric.mod.json')
tasks.register('prepareMergedMetadata') {
    inputs.file('libs/client-base.jar')
    outputs.file(mergedMetadata)
    doLast {
        def zip = new java.util.zip.ZipFile(file('libs/client-base.jar'))
        try {
            def data = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
            data.name = 'Random Stuff Client'
            data.version = project.version.toString()
            data.description = 'Random Stuff Client with module search, a tabbed module menu, and Friends management.'
            data.entrypoints.client += 'dev.randomstuff.client.gui.FriendsMod'
            data.mixins += 'randomstuffclient.gui.mixins.json'
            def target = mergedMetadata.get().asFile
            target.parentFile.mkdirs()
            target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + '\n'
        } finally {
            zip.close()
        }
    }
}
// The base client's custom loading overlay (splash, progress bar and startup sound) is dropped:
// Minecraft's own loading screen is shown instead.
def removedBaseMixins = ['LoadingOverlayMixin']
def mergedMixins = layout.buildDirectory.file('generated/merged/randomstuffclient.mixins.json')
tasks.register('prepareMergedMixins') {
    inputs.file('libs/client-base.jar')
    outputs.file(mergedMixins)
    doLast {
        def zip = new java.util.zip.ZipFile(file('libs/client-base.jar'))
        try {
            def data = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('randomstuffclient.mixins.json')))
            ['mixins', 'client', 'server'].each { key -> if (data[key] != null) data[key] = data[key].findAll { !(it in removedBaseMixins) } }
            def target = mergedMixins.get().asFile
            target.parentFile.mkdirs()
            target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + '\n'
        } finally {
            zip.close()
        }
    }
}
tasks.register('mergeClient', Jar) {
    dependsOn tasks.remapJar, tasks.prepareMergedMetadata, tasks.prepareMergedMixins
    archiveFileName = 'random-stuff-client.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(zipTree(file('libs/client-base.jar'))) {
        exclude 'config/**', 'configs/**', 'randomstuffclient/**', 'eggclient/**', 'shuclient/**', 'gui.properties'
        exclude 'fabric.mod.json', 'randomstuffclient.mixins.json', 'dev/randomstuff/mixin/LoadingOverlayMixin.class', 'META-INF/MANIFEST.MF', 'dev/randomstuff/client/gui/panels/SearchPanel.class', 'dev/randomstuff/client/config/ClientDataDirectory*.class'
    }
    from({ zipTree(tasks.remapJar.archiveFile.get().asFile) }) {
        include 'dev/randomstuff/**', 'assets/randomstuffclient/font/**', 'assets/randomstuffclient/fonts/**', 'assets/randomstuffclient/shaders/**', 'assets/randomstuffclient/textures/font/**', 'assets/randomstuffclient/textures/icons/**', 'randomstuffclient.gui.mixins.json'
    }
    from(mergedMetadata) { into '' }
    from(mergedMixins) { into '' }
    // Preserve the base client's static Mixin remapping and runtime namespace metadata.
    doFirst {
        def baseZip = new java.util.zip.ZipFile(file('libs/client-base.jar'))
        try {
            def original = new java.util.jar.Manifest(baseZip.getInputStream(baseZip.getEntry('META-INF/MANIFEST.MF')))
            manifest.attributes(original.mainAttributes.collectEntries { key, value -> [(key.toString()): value.toString()] })
        } finally {
            baseZip.close()
        }
    }
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
tasks.build { dependsOn tasks.mergeClient }

// Core API tests need the same remapped Minecraft/client classes as compilation.
tasks.test { useJUnitPlatform(); classpath += sourceSets.main.compileClasspath }

// Distribution archives contain defaults/assets, never a player's saved state.
tasks.register('verifyReleaseConfig') {
    dependsOn tasks.mergeClient
    doLast {
        def zip = new java.util.zip.ZipFile(tasks.mergeClient.archiveFile.get().asFile)
        try {
            java.util.Collections.list(zip.entries()).each { entry ->
                def name = entry.name
                assert !['config/', 'configs/', 'randomstuffclient/', 'eggclient/', 'shuclient/'].any { name.startsWith(it) } : "Saved client data in release: ${name}"
                assert !name.endsWith('/gui.properties') : "Saved GUI preferences in release: ${name}"
            }
            def mixins = zip.getInputStream(zip.getEntry('randomstuffclient.mixins.json')).text
            removedBaseMixins.each { assert !mixins.contains("\"${it}\"") : "Removed mixin still registered: ${it}" }
        } finally { zip.close() }
    }
}
tasks.check { dependsOn tasks.verifyReleaseConfig }
