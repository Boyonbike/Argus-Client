plugins {
    id 'fabric-loom' version '1.18.4'
}

version = project.mod_version
group = 'dev.argus'
base { archivesName = 'argus-client-gui' }

repositories { mavenCentral(); maven { url = 'https://maven.lenni0451.net/releases' } }

dependencies {
    implementation('io.netty:netty-handler-proxy:4.2.7.Final') { transitive = false }
    implementation('io.netty:netty-codec-socks:4.2.7.Final') { transitive = false }
    include('io.netty:netty-handler-proxy:4.2.7.Final') { transitive = false }
    include('io.netty:netty-codec-socks:4.2.7.Final') { transitive = false }
    implementation('net.raphimc:MinecraftAuth:5.0.2') { exclude group: 'com.google.code.gson' }
    include('net.raphimc:MinecraftAuth:5.0.2') { transitive = false }
    include('net.lenni0451.commons:httpclient:1.9.2') { transitive = false }
    include('net.lenni0451.commons:gson:1.9.2') { transitive = false }
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly files('libs/client-base.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.ow2.asm:asm-tree:9.10.1'
    testImplementation 'org.ow2.asm:asm-analysis:9.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// The GUI-only jars are intermediate build steps, so keep them out of build/libs.
// build/libs then holds just argus-client.jar, the one jar to install.
def intermediateJars = layout.buildDirectory.dir('intermediates/jars')
tasks.named('jar') { destinationDirectory = intermediateJars }
tasks.named('remapJar') { destinationDirectory = intermediateJars }

// Compile/remap the GUI, then combine it with the existing client at runtime names.
// Only the GUI classes replace packaged content.
def mergedMetadata = layout.buildDirectory.file('generated/merged/fabric.mod.json')
tasks.register('prepareMergedMetadata') {
    inputs.file('libs/client-base.jar')
    outputs.file(mergedMetadata)
    doLast {
        def zip = new java.util.zip.ZipFile(file('libs/client-base.jar'))
        try {
            def data = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
            data.name = 'Argus Client'
            data.version = project.version.toString()
            data.description = 'Argus Client with module search, a tabbed module menu, and Friends management.'
            data.entrypoints.client += 'dev.argus.client.gui.FriendsMod'
            data.mixins += 'argusclient.gui.mixins.json'
            data.jars = [[file: 'META-INF/jars/netty-handler-proxy-4.2.7.Final.jar'], [file: 'META-INF/jars/netty-codec-socks-4.2.7.Final.jar'], [file: 'META-INF/jars/MinecraftAuth-5.0.2.jar'], [file: 'META-INF/jars/httpclient-1.9.2.jar'], [file: 'META-INF/jars/gson-1.9.2.jar']]
            def target = mergedMetadata.get().asFile
            target.parentFile.mkdirs()
            target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + '\n'
        } finally {
            zip.close()
        }
    }
}
// The base client's custom loading overlay (splash, progress bar and startup sound) is dropped:
// Minecraft's own loading screen is shown instead.
def removedBaseMixins = ['LoadingOverlayMixin']
def mergedMixins = layout.buildDirectory.file('generated/merged/argusclient.mixins.json')
tasks.register('prepareMergedMixins') {
    inputs.file('libs/client-base.jar')
    outputs.file(mergedMixins)
    doLast {
        def zip = new java.util.zip.ZipFile(file('libs/client-base.jar'))
        try {
            def data = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('argusclient.mixins.json')))
            ['mixins', 'client', 'server'].each { key -> if (data[key] != null) data[key] = data[key].findAll { !(it in removedBaseMixins) } }
            def target = mergedMixins.get().asFile
            target.parentFile.mkdirs()
            target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + '\n'
        } finally {
            zip.close()
        }
    }
}
tasks.register('mergeClient', Jar) {
    dependsOn tasks.remapJar, tasks.prepareMergedMetadata, tasks.prepareMergedMixins
    archiveFileName = 'argus-client.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(zipTree(file('libs/client-base.jar'))) {
        exclude 'config/**', 'configs/**', 'argusclient/**', 'gui.properties'
        exclude 'fabric.mod.json', 'argusclient.mixins.json', 'dev/argus/mixin/LoadingOverlayMixin.class', 'META-INF/MANIFEST.MF'
        exclude 'dev/argus/client/modules/movement/ElytraFlyModule*.class'
        exclude 'dev/argus/client/managers/HudModuleRegistry*.class'
    }
    from({ zipTree(tasks.remapJar.archiveFile.get().asFile) }) {
        include 'META-INF/jars/**', 'dev/argus/**', 'THIRD_PARTY_NOTICES.md', 'licenses/**', 'assets/argusclient/descriptions.tsv', 'assets/argusclient/font/**', 'assets/argusclient/fonts/**', 'assets/argusclient/shaders/**', 'assets/argusclient/textures/font/**', 'assets/argusclient/textures/icons/**', 'argusclient.gui.mixins.json'
    }
    from(mergedMetadata) { into '' }
    from(mergedMixins) { into '' }
    // Preserve the base client's static Mixin remapping and runtime namespace metadata.
    doFirst {
        def baseZip = new java.util.zip.ZipFile(file('libs/client-base.jar'))
        try {
            def original = new java.util.jar.Manifest(baseZip.getInputStream(baseZip.getEntry('META-INF/MANIFEST.MF')))
            manifest.attributes(original.mainAttributes.collectEntries { key, value -> [(key.toString()): value.toString()] })
        } finally {
            baseZip.close()
        }
    }
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
tasks.build { dependsOn tasks.mergeClient }

// Core API tests need the same remapped Minecraft/client classes as compilation.
tasks.test { useJUnitPlatform(); classpath += sourceSets.main.compileClasspath }

// Distribution archives contain defaults/assets, never a player's saved state.
tasks.register('verifyReleaseConfig') {
    dependsOn tasks.mergeClient
    doLast {
        def zip = new java.util.zip.ZipFile(tasks.mergeClient.archiveFile.get().asFile)
        try {
            java.util.Collections.list(zip.entries()).each { entry ->
                def name = entry.name
                assert !['config/', 'configs/', 'argusclient/'].any { name.startsWith(it) } : "Saved client data in release: ${name}"
                assert !name.endsWith('/gui.properties') : "Saved GUI preferences in release: ${name}"
            }
            def mixins = zip.getInputStream(zip.getEntry('argusclient.mixins.json')).text
            removedBaseMixins.each { assert !mixins.contains("\"${it}\"") : "Removed mixin still registered: ${it}" }
            // Accounts/Proxies need their bundled libraries declared and present, and both mixins registered.
            def metadata = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
            assert metadata.jars : 'No nested libraries declared'
            metadata.jars.each { assert zip.getEntry(it.file) != null : "Declared nested library missing: ${it.file}" }
            def guiMixins = zip.getInputStream(zip.getEntry('argusclient.gui.mixins.json')).text
            ['AccountSessionAccessor', 'ConnectionProxyMixin'].each { assert guiMixins.contains("\"${it}\"") : "Mixin not registered: ${it}" }
        } finally { zip.close() }
    }
}
tasks.check { dependsOn tasks.verifyReleaseConfig }
